<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Petición 5</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .resultado {
            width: 400px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f5f5f5;
        }

        .resultado p {
            margin: 10px 0;
        }
    </style>
</head>
<body>

<h1>Petición 5</h1>

<div class="resultado">
    <p>
        Cultivo con mayor cantidad de semillas:
        <span th:text="${cultivoMayor.nombre}"></span>
    </p>

    <p>
        Cantidad de semillas:
        <span th:text="${cultivoMayor.cantidadSemillas}"></span>
    </p>
</div>

</body>
</html>
